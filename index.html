<!doctype html>
<!-- data-mode pins kumo's light-dark() tokens to dark; the drawing canvas is
     dark by design, so a light chrome would fight it. Drop the attribute to
     follow the system theme instead. -->
<html lang="en" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/simpleicons.svg" />
    <title>SVG Path DevTools</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
